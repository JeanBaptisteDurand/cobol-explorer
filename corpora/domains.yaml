# Manual business-domain mapping for the GenApp corpus (first match wins).
# Program names are the COBOL PROGRAM-IDs (uppercase). Glob patterns allowed.
domains:
  POLICY-UNDERWRITING:
    - "LGAPOL*"
    - "LGIPOL*"
    - "LGDPOL*"
    - "LGUPOL*"
  CUSTOMER-MANAGEMENT:
    - "LGACUS*"
    - "LGICUS*"
    - "LGDCUS*"
    - "LGUCUS*"
  DB2-DATA-ACCESS:
    - "*DB01"
    - "*DB02"
  VSAM-DATA-ACCESS:
    - "*VS01"
  TECHNICAL-SERVICES:
    - "LGSTSQ"
    - "LGASTAT1"
    - "LGSETUP"
    - "LGWEBST5"
  TESTS:
    - "LGTEST*"
