<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The product's mark: one node and everything it takes down with it.
       Square corners, because the whole system is. Ships as SVG so it stays
       crisp at every tab size and costs one request. -->
  <rect width="32" height="32" fill="#161616"/>
  <g stroke="#0f62fe" stroke-width="1.6" stroke-linecap="square">
    <path d="M11 16 H21"/>
    <path d="M12.5 12 L20 7.5"/>
    <path d="M12.5 20 L20 24.5"/>
  </g>
  <g stroke="#c6c6c6" stroke-width="1.7" fill="none">
    <rect x="21" y="3.6" width="7.8" height="7.8"/>
    <rect x="21" y="12.1" width="7.8" height="7.8"/>
    <rect x="21" y="20.6" width="7.8" height="7.8"/>
  </g>
  <rect x="2.6" y="11.4" width="9.2" height="9.2" fill="#0f62fe"/>
</svg>
