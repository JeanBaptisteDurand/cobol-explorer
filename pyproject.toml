[project]
name = "cobol-explorer"
version = "0.1.0"
description = "Mainframe-native COBOL patrimony explorer: dependency graph + grounded agentic RAG."
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["packages/core", "ingestion", "server"]
testpaths = ["packages/core/tests", "ingestion/tests", "server/tests"]
